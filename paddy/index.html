<style>
  :root {
    color-scheme: dark;
    --night: #050b1c;
    --serif: 'Cormorant Garamond', 'Cormorant', Garamond, 'Times New Roman', serif;
    /* Type: one size per screen, two weights, and five roles. Every piece of text is one of these:
       name   = what something is called (warm cream, 600)
       text   = a part's main sentences (warm cream, 500)
       detail = context, labels and list descriptions (moonlight blue, 500)
       link   = only what you can press (lamp gold, 600)
       moon   = names in the Moonlighting part (moon white, 600) */
    --c-name: #f1e6d2;
    --c-detail: #b4c3dc;
    --c-link: #f3c77a;
    --c-moon: #e2e9f3;
    --art: rgba(221, 213, 198, .82);   /* drawn assets */
    --art-accent: #f3c77a;
    --rule: rgba(180, 195, 220, .22);  /* hairlines between repeated items */
    --fs: 16px;                        /* the one text size: 16 px on phones, 17 px from 768 px up */
    --lh: 1.4;
    --measure: 28em;                   /* about 70 characters a line */
    /* Fluid spacing: each gap grows smoothly from its 320 px value to its 1024 px value */
    --gutter: clamp(16px, calc(16px + (100vw - 320px) * 40 / 704), 56px);
    --gap-s: clamp(6px, calc(6px + (100vw - 320px) * 2 / 704), 8px);
    --gap-m: clamp(20px, calc(20px + (100vw - 320px) * 12 / 704), 32px);
    --gap-l: clamp(32px, calc(32px + (100vw - 320px) * 24 / 704), 56px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --logo-k: 1;                       /* logo row scale: smaller on phones and tablets */
  }
  @media (min-width: 768px) { :root { --fs: 17px; } }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); }
  body { overscroll-behavior: none; }

  .type-name, .type-text, .type-detail, .type-link, .type-moon {
    font-family: var(--serif); font-size: var(--fs); line-height: var(--lh);
    font-style: normal; letter-spacing: normal; text-transform: none; font-variant-numeric: lining-nums;
  }
  .type-name { font-weight: 600; color: var(--c-name); }
  .type-text { font-weight: 500; color: var(--c-name); text-wrap: pretty; }
  .type-detail { font-weight: 500; color: var(--c-detail); text-wrap: pretty; }
  .type-link { font-weight: 600; color: var(--c-link); }
  .type-moon { font-weight: 600; color: var(--c-moon); }

  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    opacity: 0; transition: opacity .8s ease; touch-action: none;
  }
  #scene.ready { opacity: 1; }
  #scene.hot { cursor: pointer; }

  .who {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: var(--gutter); right: var(--gutter);
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--gap-m);
    margin: 0; text-shadow: 0 0 12px rgba(3, 8, 22, .85); pointer-events: none;
  }
  .who p { margin: 0; }
  .who #who-title { margin-left: .5em; }
  @media (max-width: 767.98px) { .who #who-title { display: block; margin: 0; } }   /* phones: the title under the name, never split */
  .who a { pointer-events: auto; text-decoration: none; }
  .who a:hover, .who a:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 3px; }

  /* The chapter sheet: parts that fill the sky one at a time (desktop) or stack in a card (phones, tablets) */
  #career {
    position: fixed; left: 50%; top: 40%; height: 40%; transform: translateX(-50%);
    width: 100%; box-sizing: border-box; padding: 0 64px;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
    font: 500 var(--fs)/var(--lh) var(--serif); color: var(--c-name); font-variant-numeric: lining-nums;
    background: linear-gradient(to bottom, rgba(4, 9, 24, 0), rgba(4, 9, 24, .5) 64px, rgba(4, 9, 24, .5) calc(100% - 64px), rgba(4, 9, 24, 0));
    text-shadow: 0 0 12px rgba(3, 8, 22, .95), 0 0 3px rgba(3, 8, 22, .8);
    /* the edges fade only within a part's own padding, so resting text is never dimmed;
       a part taller than the sheet fades out further where it runs on */
    --fade-top: var(--gap-s); --fade-bottom: var(--gap-s);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent), linear-gradient(to right, transparent, #000 60px, #000 calc(100% - 60px), transparent);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent), linear-gradient(to right, transparent, #000 60px, #000 calc(100% - 60px), transparent);
            mask-composite: intersect;
    transition: opacity .28s ease;
  }
  #career::-webkit-scrollbar { display: none; }
  #career.more-above { --fade-top: 56px; }
  #career.more-below { --fade-bottom: 56px; }
  body:not(.carousel) #career { scroll-snap-type: y mandatory; }
  #career:focus-visible { outline: 1px solid rgba(180, 195, 220, .35); outline-offset: -1px; }
  #career.fading { opacity: 0; }
  .mark {
    display: inline-block; background: currentColor;
    -webkit-mask: var(--mark) center / contain no-repeat; mask: var(--mark) center / contain no-repeat;
  }
  :where(.scene) :where(h1, h2, h3, p, dl, dd, ul, figure) { margin: 0; }
  .scene {
    box-sizing: border-box; min-height: 100%; padding: var(--gap-s) 0;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gap-m);
    align-content: center; scroll-snap-align: start; scroll-snap-stop: always;
  }
  .scene > * { opacity: 0; translate: 0 14px; transition: opacity .7s ease, translate .7s ease; }
  .scene.in > * { opacity: 1; translate: 0 0; }
  .scene.in > :nth-child(2) { transition-delay: .1s; }
  .scene.in > :nth-child(3) { transition-delay: .2s; }
  .scene.in > :nth-child(n+4) { transition-delay: .3s; }

  /* First part: the logos, then who and when on the left and the main project on the right */
  .ch-logos { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-m); color: var(--c-name); }
  .ch-logos .mark { flex: none; width: calc(var(--w) * var(--logo-k)); height: calc(var(--h) * var(--logo-k)); -webkit-mask-position: left center; mask-position: left center; }
  .ch-head { grid-column: 1 / span 5; grid-row: 2; margin-top: var(--gap-m); }
  .ch-when { margin-top: var(--gap-s); }
  .ch-lead { margin-top: var(--gap-m); max-width: var(--measure); }
  .ch-project { grid-column: 7 / span 6; grid-row: 2; align-self: start; margin-top: var(--gap-m); }
  .ch-project p { margin-top: var(--gap-s); max-width: var(--measure); }
  .s-title .ch-next { grid-row: 3; }
  .ch-next {
    grid-column: 7 / -1; justify-self: end; align-self: end; margin-top: var(--gap-l); padding: 6px 0;
    border: 0; background: none; cursor: pointer; text-shadow: inherit;
  }
  .ch-next:hover, .ch-next:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 3px; }

  /* The main project in detail: its facts, then its tools */
  .ch-kicker { grid-column: 1 / -1; }
  .ch-facts {
    grid-column: 1 / -1; margin-top: var(--gap-m); display: grid;
    grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: var(--gap-m) var(--gap-l); align-items: start;
  }
  .fact dd { margin: var(--gap-s) 0 0; max-width: var(--measure); }
  .fact .team { display: block; height: 16px; width: auto; margin: 4px 0 var(--gap-s); color: var(--art); overflow: visible; }
  .ch-tools { grid-column: 1 / span 8; margin-top: var(--gap-l); }
  .ch-tools .mark { color: var(--c-detail); vertical-align: -1px; margin-right: .4em; }
  .s-inside .ch-tools { grid-row: 3; }
  .s-inside .ch-next, .s-more .ch-next { grid-row: 3; grid-column: 9 / -1; align-self: end; }

  /* AvePoint's second project, beside its drawing */
  .s-more .ch-project { grid-column: 1 / span 7; grid-row: 1; margin-top: 0; }
  .s-more .ch-art { grid-column: 9 / span 4; grid-row: 1 / span 2; align-self: center; color: var(--art); }
  .s-more .ch-art svg { display: block; width: 100%; max-width: 300px; height: auto; overflow: visible; }
  .s-more .ch-facts { grid-column: 1 / span 7; grid-row: 2; }
  .s-more .ch-tools { grid-column: 1 / span 7; grid-row: 3; }

  /* Smaller projects: a name with a line or two under it */
  .ch-projs {
    grid-column: 1 / -1; margin: 0; padding: 0; list-style: none; display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap-m) var(--gap-l);
  }
  .proj { border-top: 1px solid var(--rule); padding-top: var(--gap-s); }
  .p-head { display: flex; align-items: center; gap: 10px; color: var(--art); }
  .p-head svg { flex: none; height: 20px; width: auto; overflow: visible; }
  .proj p { margin-top: var(--gap-s); }
  .ch-tiles {
    grid-column: 1 / -1; margin: 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-m) var(--gap-l);
  }
  .tile { border-top: 1px solid var(--rule); padding-top: var(--gap-s); }
  .t-art { height: 64px; margin-bottom: var(--gap-s); display: flex; align-items: center; color: var(--art); }
  .t-art svg { height: 100%; width: auto; max-width: 100%; overflow: visible; }
  .tile h3 + p { margin-top: var(--gap-s); }
  .s-also.few .ch-also { grid-column: 1 / span 4; grid-row: 1; align-self: start; }
  .s-also.few .ch-tiles { grid-column: 6 / span 7; grid-row: 1; grid-template-columns: minmax(0, 30rem); }
  .s-also.few .ch-next { grid-row: 2; }
  .s-also .ch-next { margin-top: var(--gap-m); }

  /* Moonlighting: that part reads by moonlight instead of lamplight */
  .s-moon { --art: rgba(201, 215, 237, .85); --art-accent: var(--c-moon); --rule: rgba(201, 215, 237, .3); }
  .s-moon .ch-also h2::before {
    content: ''; display: inline-block; width: .34em; height: .34em; margin: 0 .5em .12em 0; border-radius: 50%;
    background: var(--c-moon); box-shadow: 0 0 10px 2px rgba(201, 215, 237, .75);
  }

  /* Impact: one part, its head beside its two projects */
  .s-solo .ch-head { grid-column: 1 / span 5; grid-row: 1 / span 2; margin-top: 0; }
  .s-solo .ch-tiles { grid-column: 7 / span 6; grid-row: 1; }
  .s-solo .t-art { height: clamp(64px, 10vh, 100px); }
  .s-solo .ch-aside { grid-column: 7 / span 6; grid-row: 2; margin-top: var(--gap-m); }

  /* Drawn assets: thin lines, decorative (the text beside them carries the meaning) */
  .art { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .art .a { stroke: var(--art-accent); }
  .art .f { fill: currentColor; stroke: none; }
  .art .fa { fill: var(--art-accent); stroke: none; }
  .art .o { opacity: .5; }
  .art .p { fill: #0b1329; }
  .art .d { stroke-dasharray: 3 4; }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s ease .3s; }
  .scene.in .draw { stroke-dashoffset: 0; }

  /* Where you are in the chapter (desktop) */
  #ticks { position: fixed; display: none; flex-direction: column; transform: translateY(-50%); }
  body:not(.carousel) #ticks.on { display: flex; }
  #ticks button { width: 24px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  #ticks button::after { content: ''; width: 2px; height: 12px; background: rgba(180, 195, 220, .4); transition: height .3s ease, background-color .3s ease; }
  #ticks button[aria-current="true"]::after { height: 22px; background: var(--c-link); }
  #ticks button:hover::after { background: var(--c-name); }
  #ticks button:focus-visible { outline: 1px solid var(--c-detail); outline-offset: -2px; }

  /* Chapter dots (phones and tablets), just above the screen's safe area */
  #dots { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 6px); transform: translateX(-50%); display: none; gap: 4px; }

const FOCAL = 1087;                // focal length in pixels: the photo was shot at 26 mm equivalent
const CX = IMG_W / 2;              // optical centre
const CY = 692;                    // eye level = the horizon row on plate.png

  const W = CONFIG.wind;
  const breeze = 0.55 * Math.sin(0.9 * t - 0.0042 * x) + 0.30 * Math.sin(1.73 * t - 0.0091 * x + 1.3)
               + 0.15 * Math.sin(2.9 * t - 0.017 * x + 0.4);

  const u = t * W.gustSpeed - x;              // how far the gusts have travelled past x

  const s = (u - k * period) / W.gustSize;    // 0 to 1 while that gust passes x

function turnChapter(dir) {   // on to the next chapter's first part, or back to the previous chapter's last
  const i = active + dir, now = performance.now();
  if (active < 0 || i < 0 || i >= COMPANIES || now < chapterWait) return false;
  chapterWait = now + 900;
  select(i, dir < 0 ? 'end' : 'start');
  return true;
}
function partRest(dir) {   // how far the current part runs on past the sheet's bottom (dir 1) or top (dir -1), in pixels
  const sc = sceneEls[sceneAt];
  if (!sc || performance.now() < glideUntil) return 0;   // none while gliding to it
  return dir > 0 ? sc.offsetTop + sc.offsetHeight - careerEl.scrollTop - careerEl.clientHeight : careerEl.scrollTop - sc.offsetTop;
}
careerEl.addEventListener('scroll', () => { trackEdges(); requestAnimationFrame(() => { markScene(); hintRest(); }); }, { passive: true });

// Keyboard and screen-reader list of chapters, plus the phone dots
CAREER.forEach((c, i) => {
  const b = document.createElement('button');
  b.textContent = `${c.title}, ${c.role}, ${c.dates}`;
  b.addEventListener('focus', () => { hovered = i; });
  b.addEventListener('blur', () => { hovered = -1; });
  b.addEventListener('click', () => select(i));
  navEl.append(b);
  const d = document.createElement('button');
  d.setAttribute('aria-label', c.title);
  d.addEventListener('click', () => select(i));
  dotsEl.append(d);
});

let active = -1;
function select(i, at = 'start') {   // at: open the chapter at its 'start' or at its 'end'
  if (i < 0 || i >= COMPANIES || i === active) return;
  const first = active < 0;
  active = i;
  [...dotsEl.children].forEach((d, k) => d.setAttribute('aria-current', k === i ? 'true' : 'false'));
  statusEl.textContent = `Showing ${CAREER[i].title}`;
  if (carousel) panTo(i);
  const show = () => {
    renderChapter(i, at);
    careerEl.classList.remove('fading');
  };
  if (first || reduceMotion.matches) { show(); return; }
  careerEl.classList.add('fading');
  setTimeout(show, 220);
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  // No WebGL: show the still picture instead.
  document.body.classList.add('fallback');
  document.body.style.backgroundImage = `url(${window.PADDY_IMAGES.plate})`;
  throw err;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  2 * THREE.MathUtils.radToDeg(Math.atan(HALF_H / FOCAL)), HALF_W / HALF_H, 0.05, 200);

/* ---------- Fit the picture to the window like CSS "cover" ---------- */
const view = { x: 0, y: 0, w: IMG_W, h: IMG_H, m: 0, aw: IMG_W };  // the part of the picture on screen, in picture pixels
let pan = null, panTarget = null;   // phone carousel: left edge of the view, in picture pixels
const clampPan = x => Math.min(Math.max(x, view.m), view.m + view.aw - view.w);
function panTo(i) {
  panTarget = clampPan(CONFIG.bulbs[i].x - view.w / 2);
  if (pan === null || reduceMotion.matches) { pan = panTarget; applyView(); }
}
function applyView() {
  const vx = carousel && pan !== null ? pan : view.x;
  camera.setViewOffset(2 * HALF_W, 2 * HALF_H, vx - (CX - HALF_W), view.y - (CY - HALF_H), view.w, view.h);
}
function fitView() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  const m = Math.max(CONFIG.parallax.plate, CONFIG.parallax.grass) + 1; // spare edge for parallax
  const aw = IMG_W - 2 * m, ah = IMG_H - 2 * m, a = W / H;
  let vw, vh;
  if (a > aw / ah) { vw = aw; vh = aw / a; } else { vh = ah; vw = ah * a; }
  const vx = m + (aw - vw) * CONFIG.crop.x;
  const vy = m + (ah - vh) * CONFIG.crop.y;
  Object.assign(view, { x: vx, y: vy, w: vw, h: vh, m, aw });
  const was = carousel;
  tier = TIER.desktop.matches ? 'desktop' : TIER.tablet.matches ? 'tablet' : 'phone';
  carousel = tier !== 'desktop';
  document.body.classList.toggle('carousel', carousel);
  document.body.classList.toggle('tablet', tier === 'tablet');
  if (carousel) { panTarget = clampPan(CONFIG.bulbs[Math.max(0, active)].x - vw / 2); if (!was || pan === null) pan = panTarget; }
  if (!carousel) pan = panTarget = null;
  if (was !== carousel && active >= 0) renderChapter(active);   // parts stack on phones and tablets
  applyView();
  for (const b of bulbs || []) if (b.sign) { b.sign.visible = !carousel; b.signSmall.visible = carousel; }
  layoutCareer();
}

/* ---------- Layer 1 and 2: plate and grass ---------- */
const pictureVertex = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;

const plateMaterial = new THREE.ShaderMaterial({
  uniforms: { map: { value: null } },
  vertexShader: pictureVertex,
  fragmentShader: /* glsl */`
    uniform sampler2D map;
    varying vec2 vUv;
    void main() { gl_FragColor = texture2D(map, vUv); }`,
  depthWrite: false
});

// Painted grass: the far field waves in the same wind; under the 3D blades it is darkened
// so it reads as the shade beneath them.
const grassMaterial = new THREE.ShaderMaterial({
  uniforms: {
    ...windUniforms,
    map: { value: null },
    uSway: { value: 0 },                      // tip movement at full wind, in picture pixels
    uHorizon: { value: CY / IMG_H },          // no movement at the horizon
    uTip: { value: 870 / IMG_H },             // row where the tall blades have their tips
    uBaseDamp: { value: 0.55 },               // bases move this much less than tips
    uShadeFrom: { value: 1 }, uShadeTo: { value: 1 }, uFloorShade: { value: 1 }
  },
  vertexShader: pictureVertex,
  fragmentShader: /* glsl */`
    uniform sampler2D map;
    uniform float uSway, uHorizon, uTip, uBaseDamp, uShadeFrom, uShadeTo, uFloorShade;
    varying vec2 vUv;
    ${WIND_GLSL}
    void main() {
      vec2 uv = vUv;
      float y = 1.0 - uv.y;                                     // 0 = top, 1 = bottom
      float rise = smoothstep(uHorizon, uTip, y);               // still at the horizon, full at the tips
      float fall = 1.0 - uBaseDamp * smoothstep(uTip, 1.0, y);  // bases sway less than tips
      float w = windAt(uv.x * ${IMG_W}.0, uWindTime);
      uv.x -= w * uSway * rise * fall / ${IMG_W}.0;
      vec4 c = texture2D(map, uv);
      c.rgb *= mix(1.0, uFloorShade, smoothstep(uShadeFrom, uShadeTo, y));
      gl_FragColor = c;
    }`,
  transparent: true,
  depthWrite: false
});

function picturePlane(depth, material) {
  const s = depth / FOCAL;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(IMG_W * s, IMG_H * s), material);
  mesh.position.copy(toWorld(IMG_W / 2, IMG_H / 2, depth));
  mesh.userData.home = mesh.position.clone();
  mesh.userData.pxToWorld = s;
  return mesh;
}
const plate = picturePlane(PLATE_DEPTH, plateMaterial);
const grass = picturePlane(GRASS_DEPTH, grassMaterial);
plate.renderOrder = -2;
grass.renderOrder = -1;
scene.add(plate, grass);

/* ---------- Moonlight ---------- */

moon.position.copy(toWorld(402.5, 286.8, 40));   // where the moon is on plate.png

/* ---------- Layer 3: pole, cable, bulbs ---------- */
const rig = new THREE.Group();
scene.add(rig);

// Where the left span ends and the right span starts (the pole)
const POLE_X = (CONFIG.cable.left[CONFIG.cable.left.length - 1][0] + CONFIG.cable.right[0][0]) / 2;

// Depth of the cable, fitted to the bulb sizes: bigger bulbs are closer.
const cableDepth = (() => {
  const pts = CONFIG.bulbs.filter(b => b.x < POLE_X).map(b => [b.x, FOCAL * 2 * GLASS_R / b.w]);
  const n = pts.length;
  const mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
  let sxy = 0, sxx = 0;
  for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; }
  const slope = sxx > 0 ? sxy / sxx : 0;
  return x => my + slope * (Math.min(x, POLE_X) - mx);
})();

const warmColor = new THREE.Color(0xff9a50);
const toSRGB = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);

// Greyscale texture from paint(u, v) -> light amount (linear, 0 to 1). v = 0 is the bottom.
function gradientTexture(width, height, paint) {
  const c = document.createElement('canvas');
  c.width = width; c.height = height;
  const g = c.getContext('2d');
  const img = g.createImageData(width, height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const v = toSRGB(Math.max(0, Math.min(1, paint(x / Math.max(1, width - 1), y / Math.max(1, height - 1))))) * 255;
      const k = (y * width + x) * 4;
      img.data[k] = img.data[k + 1] = img.data[k + 2] = v;
      img.data[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.flipY = false;
  return t;
}

// Pole
const pole = (() => {
  const P = CONFIG.pole;
  const dc = cableDepth(POLE_X);
  const dTop = (dc + 0.034) / (1 - P.width[0] / (2 * FOCAL));  // pole sits just behind the cable
  const dBottom = dTop * P.width[0] / P.width[1];
  const r = (P.width[0] / 2) * dTop / FOCAL;
  const top = toWorld(P.top[0], P.top[1] + NIGHT_DY, dTop);
  const bottom = toWorld(P.bottom[0], P.bottom[1] + NIGHT_DY, dBottom);
  const up = new THREE.Vector3().subVectors(top, bottom);
  const visible = up.length();
  up.normalize();
  const length = visible * 1.5;                                  // runs well past the frame
  const foot = top.clone().addScaledVector(up, -length);
  const turn = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);

  // Warm light the bulbs throw on the pole, matched to night.png: a strong band on the front
  // (bulb 6 hangs in front of the pole) and a faint one on the left edge (bulb 5), both fading
  // down from the top. u = 0 faces the camera, u = 0.75 faces left; v = 1 is the top.
  const band = (u, centre, width) => {
    const du = Math.min(Math.abs(u - centre), 1 - Math.abs(u - centre));
    return Math.exp(-((du / width) ** 2));
  };
  const fade = (s, reach) => (s < 0.1 ? 1 : Math.exp(-(((s - 0.1) / reach) ** 2)));
  const glowMap = gradientTexture(128, 256, (u, v) => {
    const s = (1 - v) * 1.5;   // 0 at the top, 1 at the bottom of the frame
    return 0.004 + 0.65 * band(u, 0, 0.06) * fade(s, 0.21) + 0.17 * band(u, 0.76, 0.05) * fade(s, 0.18);
  });
  const metal = new THREE.MeshStandardMaterial({
    color: P.color, metalness: 0.1, roughness: 0.55,
    emissive: warmColor, emissiveMap: glowMap, emissiveIntensity: 1
  });
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, length, 28, 1), metal);
  mesh.position.copy(top).addScaledVector(up, -length / 2);
  mesh.quaternion.copy(turn);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(r * 1.02, 24, 8, 0, Math.PI * 2, 0, Math.PI / 2), metal);
  cap.scale.set(1, 0.35, 1);
  cap.position.copy(top);
  cap.quaternion.copy(turn);

  // Clamp where the cable is tied on
  const clampAt = (97 - P.top[1]) / (P.bottom[1] - P.top[1]);
  const clampMaterial = new THREE.MeshStandardMaterial({ color: 0x1e1915, roughness: 0.5, emissive: warmColor, emissiveIntensity: 0.012 });
  const clamp = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.2, r * 1.2, 0.032, 24, 1), clampMaterial);
  clamp.position.lerpVectors(top, bottom, clampAt);
  clamp.quaternion.copy(turn);

  const group = new THREE.Group();
  group.add(mesh, cap, clamp);
  group.userData.depth = dTop;
  return group;
})();
rig.add(pole);

// Cable: two spans, each a tube that sways between its anchors
const bulbXs = CONFIG.bulbs.map(b => b.x);

function buildSpan(points, anchors) {
  const flat = new THREE.SplineCurve(points.map(([x, y]) => new THREE.Vector2(x, y + NIGHT_DY)))
    .getSpacedPoints(220);
  const path = new THREE.CatmullRomCurve3(flat.map(p => toWorld(p.x, p.y, cableDepth(p.x))), false, 'centripetal');
  const SEG = 360, RAD = 6;
  const geometry = new THREE.TubeGeometry(path, SEG, CABLE_R, RAD, false);
  geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
  const ringX = new Float32Array(SEG + 1), ringW = new Float32Array(SEG + 1);
  for (let i = 0; i <= SEG; i++) {
    const p = path.getPointAt(i / SEG);
    ringX[i] = p.x * FOCAL / -p.z + CX;
    ringW[i] = swayWeight(ringX[i], anchors);
  }
  const glowMap = gradientTexture(SEG + 1, 1, u => {
    const x = ringX[Math.round(u * SEG)];
    let v = 0;
    for (const bx of bulbXs) v += Math.exp(-(((x - bx) / 22) ** 2));
    return 0.004 + 0.12 * v;
  });
  const material = new THREE.MeshStandardMaterial({
    color: 0x241d18, roughness: 0.55, metalness: 0.1,
    emissive: warmColor, emissiveMap: glowMap, emissiveIntensity: 1
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;   // vertices move every frame
  rig.add(mesh);
  return { flat, path, geometry, home: Float32Array.from(geometry.attributes.position.array), ringX, ringW, SEG, RAD, anchors };
}

function swayWeight(x, [a, b]) {
  const s = (x - a) / (b - a);
  return s <= 0 || s >= 1 ? 0 : Math.sin(Math.PI * s);
}

const spans = {
  left: buildSpan(CONFIG.cable.left, [-700, POLE_X]),
  right: buildSpan(CONFIG.cable.right, [POLE_X, 2300])
};

function spanYAt(span, x) {
  const f = span.flat;
  if (x <= f[0].x) return f[0].y;
  for (let i = 1; i < f.length; i++) {
    if (f[i].x >= x) {
      const t = (x - f[i - 1].x) / (f[i].x - f[i - 1].x || 1);
      return f[i - 1].y + (f[i].y - f[i - 1].y) * t;
    }
  }
  return f[f.length - 1].y;
}

// How far a point on the cable moves (metres), given its picture x and anchor weight.
// A gentle sway all the time; it grows while a gust passes that point, and the cable is pushed
// a little downwind.
const sway = new THREE.Vector3();
function cableSway(x, w, t, amount) {
  const k = x * 0.0045;
  const gust = Math.max(0, windAt(x, t));
  const a = w * amount * (0.35 + 1.3 * gust);
  return sway.set(
    0.004 * Math.sin(t * 0.83 - k * 0.7 + 1.1) * a + 0.006 * gust * w * amount,
    0.010 * Math.sin(t * 1.17 - k + 0.4) * a,
    0.045 * Math.sin(t * 0.91 - k * 0.8) * a + 0.03 * gust * w * amount
  );
}

function updateSpan(span, t, amount) {
  const pos = span.geometry.attributes.position;
  const arr = pos.array, home = span.home, per = span.RAD + 1;
  for (let i = 0; i <= span.SEG; i++) {
    const d = cableSway(span.ringX[i], span.ringW[i], t, amount);
    for (let j = 0; j < per; j++) {
      const k = (i * per + j) * 3;
      arr[k] = home[k] + d.x;
      arr[k + 1] = home[k + 1] + d.y;
      arr[k + 2] = home[k + 2] + d.z;
    }
  }
  pos.needsUpdate = true;
}

/* ---------- One Edison bulb model, reused 7 times ---------- */
const lathe = (pts, segments) =>
  new THREE.LatheGeometry(new THREE.SplineCurve(pts.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(48), segments);

// Profiles run bottom to top, (radius, height) in metres
const glassGeometry = lathe([
  [0.0001, -0.061], [0.0070, -0.0608], [0.0140, -0.0595], [0.0192, -0.056], [0.0215, -0.051],
  [0.0222, -0.046], [0.0214, -0.040], [0.0195, -0.032], [0.0165, -0.024], [0.0135, -0.016],
  [0.0112, -0.009], [0.0105, -0.004], [0.0118, 0]
], 40);
const socketGeometry = new THREE.LatheGeometry([
  [0.0001, -0.0278], [0.0148, -0.0278], [0.0150, -0.0262], [0.0150, -0.0232], [0.0142, -0.0226],
  [0.0146, -0.0214], [0.0146, -0.0188], [0.0137, -0.0182], [0.0138, -0.0170], [0.0130, -0.0110],
  [0.0122, -0.0030], [0.0112, -0.0006], [0.0060, 0], [0.0001, 0]
].map(([r, y]) => new THREE.Vector2(r, y)), 28);
const wireGeometry = new THREE.CylinderGeometry(0.0032, 0.0032, 1, 8).translate(0, -0.5, 0);
const sleeveGeometry = new THREE.CylinderGeometry(0.0068, 0.0068, 0.05, 12);
const knobGeometry = new THREE.CylinderGeometry(0.0036, 0.0044, 0.011, 10).translate(0, 0.0095, 0);
const stemGeometry = new THREE.CylinderGeometry(0.0056, 0.0044, 0.02, 10).translate(0, -0.012, 0);
const hitGeometry = new THREE.SphereGeometry(0.05, 12, 8);

const plasticMaterial = new THREE.MeshStandardMaterial({
  color: 0x231d19, roughness: 0.5, emissive: warmColor, emissiveIntensity: 0.012
});
const socketMaterial = new THREE.MeshStandardMaterial({
  color: 0x231d19, roughness: 0.45, emissive: warmColor, emissiveIntensity: 1,
  emissiveMap: gradientTexture(4, 64, (u, v) => 0.006 + 0.2 * Math.pow(1 - v, 8))  // rim lit by the glass below
});
const glassMaterial = new THREE.ShaderMaterial({
  uniforms: { uBoost: { value: 0 }, uOn: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      vP = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uBoost, uOn;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main() {
      float facing = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
      // amber glass with a bright outline where it curves away
      vec3 col = mix(vec3(0.88, 0.47, 0.12), vec3(1.0, 0.72, 0.35), smoothstep(0.55, 0.95, 1.0 - facing));
      // soft light around the filaments, then the filaments themselves
      float band = (1.0 - smoothstep(-0.019, -0.012, vP.y)) * smoothstep(-0.056, -0.046, vP.y);
      col = mix(col, vec3(1.0, 0.82, 0.52), exp(-pow(vP.x / 0.009, 2.0)) * band * 0.75);
      float fil = 0.0;
      for (int k = 0; k < 4; k++) {
        float fx = (float(k) - 1.5) * 0.0030;
        fil += 1.0 - smoothstep(0.0004, 0.0012, abs(vP.x - fx));
      }
      col = mix(col, vec3(1.0, 0.97, 0.88), clamp(fil, 0.0, 1.0) * band * smoothstep(0.2, 0.6, facing));
      // clicked: brighter and whiter
      col = mix(col * (1.0 + 0.3 * uBoost), vec3(1.0, 0.95, 0.82), 0.25 * uBoost);
      // switched off: dark glass with a faint cool edge from the moon
      vec3 off = mix(vec3(0.05, 0.05, 0.07), vec3(0.22, 0.25, 0.32), pow(1.0 - facing, 2.0));
      col = mix(off, col, uOn);
      gl_FragColor = vec4(min(col, vec3(1.0)), 1.0);
    }`
});
const glowTexture = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0.00, 'rgba(255, 200, 125, 0.75)');
  grd.addColorStop(0.15, 'rgba(255, 166, 80, 0.45)');
  grd.addColorStop(0.35, 'rgba(255, 136, 50, 0.18)');
  grd.addColorStop(0.60, 'rgba(255, 122, 38, 0.06)');
  grd.addColorStop(1.00, 'rgba(255, 120, 30, 0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const hitMaterial = new THREE.MeshBasicMaterial({ visible: false });

const hits = [];
var bulbs = null;
bulbs = CONFIG.bulbs.map((cfg, index) => {
  const span = cfg.x > POLE_X ? spans.right : spans.left;
  const cy = spanYAt(span, cfg.x);                 // cable height above this bulb
  const gy = cfg.y + NIGHT_DY;                     // glass centre
  const depth = cableDepth(cfg.x);
  const scale = cfg.w / (2 * GLASS_R * FOCAL / depth);
  const drop = (gy - cy) * depth / FOCAL / scale;  // junction to glass centre, model units
  const hang = Math.max(0.005, drop - SOCKET_H - GLASS_H / 2 - 0.02);

  const root = new THREE.Group();
  root.position.copy(toWorld(cfg.x, cy, depth));
  root.scale.setScalar(scale);
  root.userData.home = root.position.clone();

  // T-connector, lined up with the cable
  const a = toWorld(cfg.x - 6, spanYAt(span, cfg.x - 6), cableDepth(cfg.x - 6));
  const b = toWorld(cfg.x + 6, spanYAt(span, cfg.x + 6), cableDepth(cfg.x + 6));
  const sleeve = new THREE.Mesh(sleeveGeometry, plasticMaterial);
  sleeve.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.sub(a).normalize());
  root.add(sleeve, new THREE.Mesh(knobGeometry, plasticMaterial), new THREE.Mesh(stemGeometry, plasticMaterial));

  // Everything below the connector swings
  const swing = new THREE.Group();
  swing.position.y = -0.02;
  root.add(swing);
  const wire = new THREE.Mesh(wireGeometry, plasticMaterial);
  wire.scale.y = hang + 0.002;
  const socket = new THREE.Mesh(socketGeometry, socketMaterial);
  socket.position.y = -hang;
  const material = glassMaterial.clone();
  const glass = new THREE.Mesh(glassGeometry, material);
  glass.position.y = -hang - SOCKET_H;
  glass.renderOrder = 1;
  const glowMaterial = new THREE.SpriteMaterial({
    map: glowTexture, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, depthTest: false, opacity: CONFIG.glow.opacity
  });
  const glow = new THREE.Sprite(glowMaterial);
  glow.position.y = -hang - SOCKET_H - GLASS_H * 0.55;
  glow.renderOrder = 2;
  const hit = new THREE.Mesh(hitGeometry, hitMaterial);
  hit.position.y = -hang - SOCKET_H - GLASS_H / 2;
  hit.userData.index = index;
  if (index < COMPANIES) hits.push(hit);
  swing.add(wire, socket, glass, glow, hit);
  rig.add(root);

  return {
    root, swing, glow, material, glowMaterial,
    weight: swayWeight(cfg.x, span.anchors), x: cfg.x,
    // each bulb is a small pendulum with its own swing rate, so they drift out of step
    rate: 2 * Math.PI * (0.62 + 0.16 * frac(index * 0.618034)),
    side: 0, sideV: 0, fore: 0, foreV: 0,
    hover: 0, lit: 0, on: 0,
    hit, gy, depth, scale, hang, sign: null, signSmall: null, signTag: null, signMats: null

/* ---------- Grass blades built in code, across the front of the picture ---------- */
// One blade shape drawn thousands of times in a single call. Each copy has its own spot, size,
// lean and colour (taken from grass.png where it stands). The wind bends it on the GPU.
const bladeGeometry = new THREE.InstancedBufferGeometry();
{
  const SEG = 4, pos = [], index = [];
  for (let s = 0; s < SEG; s++) pos.push(-1, s / SEG, 0, 1, s / SEG, 0);  // two edges per row
  pos.push(0, 1, 0);                                                     // the tip
  for (let s = 0; s < SEG - 1; s++) { const a = s * 2; index.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  index.push((SEG - 1) * 2, (SEG - 1) * 2 + 1, SEG * 2);
  bladeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bladeGeometry.setIndex(index);
}
const MAX_BLADES = Math.max(CONFIG.grass.count, CONFIG.grass.phoneCount);
const bladeAttr = {
  aBase: new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLADES * 3), 3),  // foot of the blade
  aShape: new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLADES * 4), 4), // height, width, turn, seed stalk?
  aLean: new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLADES * 4), 4),  // lean x, lean z, flutter, picture x
  aColA: new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLADES * 3), 3),  // colour at the foot
  aColB: new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLADES * 3), 3)   // colour at the tip
};
for (const [name, attr] of Object.entries(bladeAttr)) bladeGeometry.setAttribute(name, attr);
bladeGeometry.instanceCount = 0;

rig.updateMatrixWorld(true);
const lamps = bulbs.map(b => b.hit.getWorldPosition(new THREE.Vector3()));

const bladeMaterial = new THREE.ShaderMaterial({
  uniforms: {
    ...windUniforms,
    uSway: { value: 1 },
    uMouse: { value: new THREE.Vector2() },
    uParallax: { value: new THREE.Vector2() },   // picture pixels: near blades, far blades
    uNear: { value: BLADE_NEAR }, uFar: { value: CONFIG.grass.depth },
    uLamps: { value: lamps },
    uWarmth: { value: CONFIG.grass.lampWarmth }
  },
  vertexShader: /* glsl */`
    attribute vec3 aBase; attribute vec4 aShape; attribute vec4 aLean; attribute vec3 aColA; attribute vec3 aColB;
    uniform float uSway, uNear, uFar, uWarmth;
    uniform vec2 uMouse, uParallax;
    uniform vec3 uLamps[${lamps.length}];
    varying vec3 vColor; varying vec2 vBlade; varying float vKind;
    ${WIND_GLSL}
    void main() {
      float v = position.y, h = aShape.x, kind = aShape.w;
      // a leaf tapers to a point; a seed stalk is a thin stem with a wider head for the grains
      float leaf = 1.0 - pow(v, 3.0);
      float stalk = mix(0.3, 1.0, smoothstep(0.74, 0.8, v)) * (1.0 - 0.7 * smoothstep(0.9, 1.0, v));
      float width = aShape.y * mix(leaf, stalk, kind);
      vec3 across = vec3(cos(aShape.z), 0.0, -sin(aShape.z));
      // wind: lean downwind, plus a quick flutter that grows in a gust
      float w = windAt(aLean.w, uWindTime) * uSway;
      float flutter = sin(uWindTime * (2.2 + 1.6 * aLean.z) + 6.2832 * aLean.z)
                    * (0.08 + 0.5 * clamp(w, 0.0, 1.0)) * uSway * uWindStrength;
      vec2 lean = aLean.xy + vec2(0.55 * w + 0.07 * flutter, 0.03 * flutter);
      vec2 bend = lean * h * v * v;                              // the foot stays put, the tip moves most
      vec3 p = aBase + across * position.x * width * 0.5
             + vec3(bend.x, v * h - 0.5 * dot(bend, bend) / max(h, 0.01), bend.y);
      // parallax: near blades drift like the pole and bulbs, far ones like grass.png
      float depth = -aBase.z;
      float px = mix(uParallax.x, uParallax.y, smoothstep(uNear, uFar, depth));
      p.xy += vec2(-uMouse.x, uMouse.y) * px * depth / ${FOCAL}.0;
      // colour from grass.png, warmer near the lamps, a touch of cool moonlight higher up
      vec3 col = mix(aColA, aColB, smoothstep(0.0, 0.85, v));
      float warm = 0.0;
      for (int i = 0; i < ${lamps.length}; i++) { vec3 d = p - uLamps[i]; warm += exp(-dot(d, d) / 3.0); }
      col += vec3(0.10, 0.055, 0.015) * uWarmth * min(warm, 1.5) * v;
      col += vec3(0.01, 0.02, 0.04) * v;
      vColor = col; vBlade = vec2(position.x, v); vKind = kind;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying vec2 vBlade; varying float vKind;
    void main() {
      vec3 col = vColor * (0.88 + 0.24 * (1.0 - abs(vBlade.x)));
      if (vKind > 0.5 && vBlade.y > 0.76) {
        // seed head: rows of grains, alternating either side of the stem
        float grain = 0.5 + 0.5 * sin(vBlade.y * 377.0 + step(0.0, vBlade.x) * 3.14159);
        col *= 0.8 + 0.4 * grain;
      }
      gl_FragColor = vec4(min(col, vec3(1.0)), 1.0);
    }`,
  side: THREE.DoubleSide
});
const blades = new THREE.Mesh(bladeGeometry, bladeMaterial);
blades.frustumCulled = false;   // blades move in the shader
scene.add(blades);

// Colours are read from grass.png once it has loaded
function makeSampler(image) {
  const c = document.createElement('canvas');
  c.width = image.width; c.height = image.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(image, 0, 0);
  const { data, width, height } = g.getImageData(0, 0, c.width, c.height);
  // colour of a small patch, 0 to 1: its average, and its brightest pixel (a lit leaf)
  return (x, y, r = 3) => {
    let R = 0, G = 0, B = 0, n = 0, best = -1, bR = 0, bG = 0, bB = 0;
    const xi = Math.round(x), yi = Math.round(y);
    for (let yy = yi - r; yy <= yi + r; yy++) {
      for (let xx = xi - r; xx <= xi + r; xx++) {
        const k = (Math.min(height - 1, Math.max(0, yy)) * width + Math.min(width - 1, Math.max(0, xx))) * 4;
        R += data[k]; G += data[k + 1]; B += data[k + 2]; n++;
        const lum = data[k] * 0.3 + data[k + 1] * 0.6 + data[k + 2] * 0.1;
        if (lum > best) { best = lum; bR = data[k]; bG = data[k + 1]; bB = data[k + 2]; }
      }
    }
    return { mean: [R / n / 255, G / n / 255, B / n / 255], bright: [bR / 255, bG / 255, bB / 255] };
  };
}

function mulberry32(seed) {   // small repeatable random numbers, so the field looks the same each visit
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let sample = null, bladeShare = 1;   // bladeShare drops if the device is slow
const isPhone = () => window.matchMedia('(pointer: coarse)').matches || Math.min(window.innerWidth, window.innerHeight) < 600;

function placeBlades() {
  if (!sample) return;
  const G = CONFIG.grass, A = bladeAttr;
  const count = Math.floor(Math.min(MAX_BLADES, isPhone() ? G.phoneCount : G.count) * bladeShare);
  const rand = mulberry32(20260927);
  const far = Math.max(BLADE_NEAR + 1, G.depth);
  const rowNear = CY + EYE_HEIGHT * FOCAL / BLADE_NEAR;    // below the frame: only the tips show
  const rowFar = CY + EYE_HEIGHT * FOCAL / far;
  const x0 = -60, x1 = IMG_W + 60;                         // the whole picture, so the carousel can pan
  for (let i = 0; i < count; i++) {
    const row = rowFar + (rowNear - rowFar) * Math.pow(rand(), 1.35);  // more rows at the back, where blades are small
    const d = EYE_HEIGHT * FOCAL / (row - CY);
    const px = x0 + (x1 - x0) * rand();
    const seed = d < 6 && rand() < G.seedHeads;
    const shrink = 1 - 0.6 * THREE.MathUtils.smoothstep(d, far * 0.65, far);  // fade out towards the back
    const h = (seed ? 0.8 + 0.35 * rand() : 0.5 + 0.45 * rand()) * G.height * shrink;
    const w = Math.max(seed ? 0.014 : 0.013 + 0.012 * rand(), 1.4 * d / FOCAL);
    const leanDir = rand() * Math.PI * 2, leanBy = (seed ? 0.25 : 0.2) + (seed ? 0.35 : 0.55) * rand();  // blades arch
    A.aBase.setXYZ(i, (px - CX) * d / FOCAL, -EYE_HEIGHT, -d);
    A.aShape.setXYZW(i, h, w, (rand() - 0.5) * 2.2, seed ? 1 : 0);
    A.aLean.setXYZW(i, Math.cos(leanDir) * leanBy, Math.sin(leanDir) * leanBy, rand(), px);
    // tip colour from where the tip lands in grass.png, foot colour from where it stands (darker)
    // most blades take the patch's average colour; about a third catch the light like the lit leaves
    const at = sample(px, Math.max(708, CY + (EYE_HEIGHT - h) * FOCAL / d));
    const lit = seed || rand() < 0.3;
    let tip = lit ? at.mean.map((c, k) => c * 0.4 + at.bright[k] * 0.6) : at.mean;
    if (seed) tip = tip.map((c, k) => c * 0.8 + [0.78, 0.66, 0.26][k] * 0.2);    // a little more yellow
    const foot = sample(px, Math.min(IMG_H - 1, row)).mean;
    A.aColB.setXYZ(i, tip[0], tip[1], tip[2]);
    A.aColA.setXYZ(i, foot[0] * 0.45, foot[1] * 0.45, foot[2] * 0.45);
  }
  for (const attr of Object.values(A)) attr.needsUpdate = true;
  bladeGeometry.instanceCount = count;
  bladeMaterial.uniforms.uFar.value = far;
  // darken the painted grass from the row where the blade tips begin
  const shadeFrom = (CY + (EYE_HEIGHT - 0.9 * G.height) * FOCAL / far) / IMG_H;
  grassMaterial.uniforms.uShadeFrom.value = shadeFrom;
  grassMaterial.uniforms.uShadeTo.value = Math.min(1, shadeFrom + 0.12);
  grassMaterial.uniforms.uFloorShade.value = G.floorShade;
}

// Speed safety: if the first seconds run under 45 frames a second, draw half the blades (at most twice)
const safety = { from: 0, frames: 0, checks: 0 };
function checkSpeed(now, gap) {
  if (window.__paddyNoSafety || safety.checks >= 2 || bladeGeometry.instanceCount === 0) return;
  if (gap > 0.25 || !safety.from) { safety.from = now; safety.frames = 0; return; }  // hidden tab or first frame
  safety.frames++;
  if (now - safety.from < 3000) return;
  const fps = safety.frames * 1000 / (now - safety.from);
  if (fps < 45) {
    bladeShare /= 2;
    bladeGeometry.instanceCount = Math.floor(bladeGeometry.instanceCount / 2);
    safety.checks++;
  } else {
    safety.checks = 2;   // fast enough: stop watching
  }
  safety.from = 0;
}

/* ---------- Signs: small tags hanging under the company bulbs (desktop) ---------- */
const markImages = {};
const loadImage = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
const cordGeometry = new THREE.CylinderGeometry(0.0011, 0.0011, 1, 6).translate(0, -0.5, 0);
const cordMaterial = new THREE.MeshBasicMaterial({ color: 0x5b4a34 });   // twine

function tint(g, im, x, y, w, h, ink) {   // draw a logo mask in one ink
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  const t = c.getContext('2d');
  t.drawImage(im, 0, 0, c.width, c.height);
  t.globalCompositeOperation = 'source-in';
  t.fillStyle = ink; t.fillRect(0, 0, c.width, c.height);
  g.drawImage(c, x, y);
}

function drawSign(sign, seed, small = false) {        // small: the phone and tablet tag, logo only
  const S = CONFIG.signs, R = 3;                        // canvas pixels per picture pixel
  const T = small ? S.phone : S, W = T.width * R, H = T.height * R;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const rnd = seeded(seed * 7919 + 17);
  const x0 = 1.5 * R, y0 = 1.5 * R, w = W - 3 * R, h = H - 3 * R;
  // the plank, a little lighter at the top where the bulb lights it
  g.save();
  g.beginPath(); g.roundRect(x0, y0, w, h, 4 * R); g.clip();
  const wood = g.createLinearGradient(0, 0, 0, H);
  wood.addColorStop(0, S.wood[0]); wood.addColorStop(1, S.wood[1]);
  g.fillStyle = wood; g.fillRect(0, 0, W, H);
  // grain: long wavy lines along the plank, flowing round one small knot near a lower corner
  const knot = { x: W * (rnd() < 0.5 ? 0.12 : 0.88), y: H * (0.7 + rnd() * 0.14) }, kr = 8 * R;
  for (let k = 0; k < 30; k++) {
    const base = y0 + rnd() * h, amp = (0.5 + rnd() * 1.6) * R, len = (40 + rnd() * 70) * R, ph = rnd() * 6.283;
    g.beginPath();
    for (let x = -6; x <= W + 6; x += 4) {
      let y = base + amp * Math.sin(x / len * 6.283 + ph);
      const dx = x - knot.x, dy = y - knot.y;
      y += (dy >= 0 ? 1 : -1) * kr * 0.9 * Math.exp(-(dx * dx + dy * dy) / (kr * kr));
      if (x === -6) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.strokeStyle = `rgba(96, 58, 28, ${(S.grain * (0.35 + 0.65 * rnd())).toFixed(3)})`;
    g.lineWidth = (0.25 + rnd() * 0.8) * R;
    g.stroke();
  }
  for (let k = 3; k >= 1; k--) {
    g.beginPath(); g.ellipse(knot.x, knot.y, k * 1.9 * R, k * 1.2 * R, 0, 0, Math.PI * 2);
    g.strokeStyle = `rgba(88, 50, 22, ${S.grain * 1.1})`; g.lineWidth = 0.6 * R; g.stroke();
  }
  g.beginPath(); g.ellipse(knot.x, knot.y, 1.3 * R, 0.8 * R, 0, 0, Math.PI * 2);
  g.fillStyle = `rgba(80, 44, 18, ${S.grain * 1.6})`; g.fill();
  // weathering: darker ends, a light bevel along the top, a darker strip for the plank's thickness
  const ends = g.createLinearGradient(0, 0, W, 0);
  ends.addColorStop(0, 'rgba(70, 40, 16, .3)'); ends.addColorStop(0.1, 'rgba(70, 40, 16, 0)');
  ends.addColorStop(0.9, 'rgba(70, 40, 16, 0)'); ends.addColorStop(1, 'rgba(70, 40, 16, .3)');
  g.fillStyle = ends; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255, 232, 190, .3)'; g.fillRect(0, y0, W, 1.2 * R);
  g.fillStyle = 'rgba(62, 36, 14, .5)'; g.fillRect(0, H - 3.6 * R, W, 2.1 * R);
  g.restore();
  g.beginPath(); g.roundRect(x0, y0, w, h, 4 * R);
  g.lineWidth = 1.1 * R; g.strokeStyle = 'rgba(58, 32, 12, .6)'; g.stroke();
  // a small metal screw eye where the cord ties on
  g.beginPath(); g.arc(W / 2, 9 * R, 2.3 * R, 0, Math.PI * 2);
  g.lineWidth = 1.1 * R; g.strokeStyle = '#a0988d'; g.stroke();
  g.beginPath(); g.arc(W / 2, 9 * R, 1 * R, 0, Math.PI * 2); g.fillStyle = '#2a1a0e'; g.fill();
  // lettering burnt into the wood: logo (or name), dates, role, OutSystems
  g.shadowColor = 'rgba(92, 44, 12, .55)'; g.shadowBlur = 1.4 * R;
  const rows = [];
  if (small) {
    if (sign.logo) {
      const im = markImages[sign.logo], k = Math.min(W * 0.76 / im.width, 20 * R / im.height);
      rows.push({ h: im.height * k, draw: y => tint(g, im, (W - im.width * k) / 2, y, im.width * k, im.height * k, S.ink) });
    } else rows.push({ h: 17 * R, draw: y => text(sign.name[0], y, 16, '.14em') });
  } else if (sign.logo) {
    const im = markImages[sign.logo], k = Math.min(W * 0.74 / im.width, 30 * R / im.height);
    rows.push({ h: im.height * k, draw: y => tint(g, im, (W - im.width * k) / 2, y, im.width * k, im.height * k, S.ink) });
  } else {
    rows.push({ h: 19 * R, draw: y => text(sign.name[0], y, 17, '.16em') });
    rows.push({ h: 13 * R, draw: y => text(sign.name[1], y, 11, '.1em') });
  }
  if (!small) {
    rows.push({ h: 7 * R });
    rows.push({ h: 14 * R, draw: y => text(sign.dates, y, 12, '.14em') });
    rows.push({ h: 3 * R });
    for (const line of sign.role) rows.push({ h: 13 * R, draw: y => text(line, y, 11, '.1em') });
  }
  if (sign.ring && !small) {
    const im = markImages.outsystems, k = Math.min(W * 0.46 / im.width, 10 * R / im.height);
    rows.push({ h: 5 * R });
    rows.push({ h: im.height * k, draw: y => tint(g, im, (W - im.width * k) / 2, y, im.width * k, im.height * k, S.ink) });
  }
  const total = rows.reduce((t, r) => t + r.h, 0);
  let y = 14 * R + (H - 18 * R - total) / 2;
  for (const r of rows) { if (r.draw) r.draw(y); y += r.h; }
  return c;
  function text(t, y, size, spacing) {
    g.fillStyle = S.ink; g.textAlign = 'center'; g.textBaseline = 'top';
    let px = size * R;
    const fit = () => { g.font = `600 ${px}px ${SERIF}`; g.letterSpacing = spacing.replace('em', '') * px + 'px'; };
    fit();
    const room = W * 0.88;
    if (g.measureText(t).width > room) { px *= room / g.measureText(t).width; fit(); }   // shrink to fit the tag
    g.fillText(t, W / 2, y);
  }
}

function buildSigns() {
  const S = CONFIG.signs;
  bulbs.slice(0, COMPANIES).forEach((b, i) => {
    const lpp = b.depth / FOCAL / b.scale;               // bulb units per picture pixel
    const glassBottom = -b.hang - SOCKET_H - GLASS_H;
    const hang = (canvas, w, h) => {                     // a cord from the glass, and a tag hanging by its hole
      const group = new THREE.Group();
      const cord = new THREE.Mesh(cordGeometry, cordMaterial);
      cord.position.y = glassBottom;
      cord.scale.y = S.cord * lpp;
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const mat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, toneMapped: false });
      const tag = new THREE.Mesh(new THREE.PlaneGeometry(w * lpp, h * lpp), mat);
      tag.userData = { index: i, hole: glassBottom - S.cord * lpp, holeDrop: 9 * lpp, half: h * lpp / 2 };
      tag.position.y = tag.userData.hole + tag.userData.holeDrop - tag.userData.half;
      hits.push(tag);
      group.add(cord, tag);
      b.swing.add(group);
      return { group, tag, mat };
    };
    const big = hang(drawSign(CAREER[i].sign, i + 1), S.width, S.height);
    const small = hang(drawSign(CAREER[i].sign, i + 1, true), S.phone.width, S.phone.height);
    b.sign = big.group; b.signTag = big.tag; b.signSmall = small.group;
    b.signMats = [big.mat, small.mat];
    big.group.visible = !carousel; small.group.visible = carousel;
  });
}
// Desktop: scale the tags up on smaller screens so the lettering stays readable, still hanging by their holes
function sizeSigns(k) {
  for (const b of bulbs.slice(0, COMPANIES)) {
    const t = b.signTag;
    if (!t) continue;   // not built yet
    const u = t.userData;
    t.scale.setScalar(k);
    t.position.y = u.hole + (u.holeDrop - u.half) * k;
  }
}

// Picture rows: where the signs end and the 3D grass begins, used to place the reading column
function glassBottomRow(b) { return b.gy + (GLASS_H / 2) * b.scale * FOCAL / b.depth; }
function layoutCareer() {
  if (!bulbs) return;
  const W = window.innerWidth, H = window.innerHeight, S = CONFIG.signs;
  const toY = row => (row - view.y) * H / view.h;
  const toX = col => (col - view.x) * W / view.w;
  const company = bulbs.slice(0, COMPANIES);
  const k = carousel ? 1 : Math.max(1, S.minWidth / (S.width * H / view.h));
  sizeSigns(k);
  const below = carousel
    ? Math.max(...company.map(b => glassBottomRow(b) + S.cord + S.phone.height - 9))    // under the small signs
    : Math.max(...company.map(b => glassBottomRow(b) + S.cord + (S.height - 9) * k));   // under the lowest sign
  const top = Math.max(56, toY(below) + 10);
  careerEl.style.top = `${top}px`;
  if (carousel) {   // phones and tablets: CSS runs the card down into the grass, ending above the dots and the safe area
    careerEl.style.height = careerEl.style.left = careerEl.style.width = careerEl.style.transform = '';
    hintRest();
    return;
  }
  // Desktop: from under the signs to just into the grass; content up to 960 px wide, stopping short of the pole
  const grassTop = toY(CY + (EYE_HEIGHT - 0.9 * CONFIG.grass.height) * FOCAL / CONFIG.grass.depth);
  let bottom = Math.min(H - 8, grassTop + CONFIG.sheet.grassOverlap);
  if (bottom - top < 240) bottom = Math.min(H - 8, top + 240);   // always room to read
  const P = CONFIG.pole, row = view.y + (top + bottom) / 2 * view.h / H;
  const poleLeft = P.top[0] + (P.bottom[0] - P.top[0]) * (row - P.top[1]) / (P.bottom[1] - P.top[1]) - P.width[0] / 2;
  const right = Math.min(W - 24, toX(poleLeft) - 44), pad = 64;   // pad: clear of the sheet's faded edges
  const width = Math.min(960 + 2 * pad, right - 24);
  const left = 24 + (right - 24 - width) / 2;
  Object.assign(careerEl.style, { height: `${bottom - top}px`, left: `${left}px`, width: `${width}px`, transform: 'none' });
  ticksEl.style.left = `${left + width + 8}px`;
  ticksEl.style.top = `${(top + bottom) / 2}px`;
  hintRest();
}

/* ---------- Interaction ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = -1;

function pick(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const found = raycaster.intersectObjects(hits.filter(h => h.parent && h.parent.visible !== false), false);
  return found.length ? found[0].object.userData.index : -1;
}

const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.ty = (e.clientY / window.innerHeight) * 2 - 1;
  const i = pick(e.clientX, e.clientY);
  hovered = i;
  canvas.classList.toggle('hot', i >= 0);
});
window.addEventListener('mouseout', e => {
  if (e.relatedTarget) return;   // still inside the page
  hovered = -1;
  mouse.tx = mouse.ty = 0;
  canvas.classList.remove('hot');
});
// Click or tap a company bulb to read its chapter; on phones, swipe sideways to move along the lights
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  down = null;
  if (carousel && Math.abs(dx) > 40 && Math.abs(dx) > 1.3 * Math.abs(dy)) {
    select(Math.max(0, Math.min(COMPANIES - 1, active + (dx < 0 ? 1 : -1))));
    return;
  }
  if (Math.hypot(dx, dy) < 12) { const i = pick(e.clientX, e.clientY); if (i >= 0) select(i); }
});
canvas.addEventListener('pointercancel', () => { down = null; });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') select(Math.min(COMPANIES - 1, active + 1));
  if (e.key === 'ArrowLeft') select(Math.max(0, active - 1));
  if (carousel) return;
  const dir = e.key === 'ArrowDown' || e.key === 'PageDown' ? 1 : e.key === 'ArrowUp' || e.key === 'PageUp' ? -1 : 0;
  if (!dir) return;
  e.preventDefault();
  const rest = partRest(dir);   // a part taller than the sheet (short windows): read on through it first
  if (rest > 2) { careerEl.scrollBy({ top: dir * Math.min(rest, careerEl.clientHeight * 0.8), behavior: reduceMotion.matches ? 'auto' : 'smooth' }); return; }
  const k = sceneAt + dir;
  if (k >= 0 && k < sceneEls.length) goScene(k, dir < 0 ? 'end' : 'start');
  else if (!e.repeat) turnChapter(dir);   // past the end (or the start): the next (or previous) chapter
});
// Wheel and trackpad. A gesture is a run of wheel events less than 200 ms apart.
// Desktop: the page steps through the chapter's parts itself, one part per notch (or per 700 ms of a long swipe),
// so a small scroll never snaps back. A part taller than the sheet (short windows) scrolls through first; the
// gesture that brings it in stops at its edge, and stepping on from it takes a fresh gesture. Turning to another
// chapter takes a fresh gesture that starts once the chapter is already at its last (or first) part, so a
// flick's momentum can't skip ahead.
// Phones: the card scrolls itself, and a fresh gesture past its end opens the next chapter.
const gesture = { start: 0, last: 0, sum: 0, done: false, inner: false, stepped: false };
let wheelWait = 0;
window.addEventListener('wheel', e => {
  if (active < 0 || !e.deltaY) return;
  const now = performance.now(), dir = Math.sign(e.deltaY);
  if (now - gesture.last > 200 || Math.sign(gesture.sum) === -dir) Object.assign(gesture, { start: now, sum: 0, done: false, inner: false, stepped: false });
  gesture.last = now;
  gesture.sum += e.deltaY;
  if (carousel) {
    if (dir > 0 && !gesture.done && edge.bottom && edge.bottom < gesture.start && gesture.sum >= 60) gesture.done = turnChapter(1);
    return;
  }
  const rest = partRest(dir);   // a part taller than the sheet scrolls through first, up to its edge
  if (rest > 2) {
    if (e.cancelable) e.preventDefault();
    else if (careerEl.contains(e.target)) return;   // the browser is already scrolling the sheet
    if (gesture.stepped) return;
    gesture.inner = true;
    const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * careerEl.clientHeight : e.deltaY;
    careerEl.scrollBy({ top: dir * Math.min(rest, Math.abs(px)) });
    return;
  }
  if (e.cancelable) e.preventDefault();
  if (gesture.done || gesture.inner || Math.abs(gesture.sum) < 40) return;
  const k = sceneAt + dir;
  if (k >= 0 && k < sceneEls.length) {
    if (now < wheelWait) return;
    wheelWait = now + 700;
    gesture.sum = 0;
    gesture.stepped = true;
    goScene(k, dir < 0 ? 'end' : 'start');
    return;
  }
  const edgeAt = dir > 0 ? edge.bottom : edge.top;
  if (edgeAt && edgeAt < gesture.start && Math.abs(gesture.sum) >= 60 && turnChapter(dir)) gesture.done = true;
}, { passive: false });
// Touch: pull the chapter up past its end for the next one (on desktop, down past its start for the previous one)
let touch = null;
careerEl.addEventListener('touchstart', e => {
  touch = e.touches.length === 1 ? { y: e.touches[0].clientY, top: edge.top > 0, bottom: edge.bottom > 0 } : null;
}, { passive: true });
careerEl.addEventListener('touchmove', e => {
  if (!touch || e.touches.length !== 1) return;
  const dy = touch.y - e.touches[0].clientY;   // > 0: the finger moved up
  const lastPart = carousel || sceneAt === sceneEls.length - 1, firstPart = !carousel && sceneAt === 0;
  if ((touch.bottom && lastPart && dy > 70 && turnChapter(1)) || (touch.top && firstPart && dy < -70 && turnChapter(-1))) touch = null;
}, { passive: true });
careerEl.addEventListener('touchend', () => { touch = null; }, { passive: true });
careerEl.addEventListener('touchcancel', () => { touch = null; }, { passive: true });
window.addEventListener('resize', fitView);

/* ---------- Animation ---------- */
let wind = 0, motion = reduceMotion.matches ? 0 : 1, last = performance.now(), startAt = 0;
const baseGlow = 2 * GLASS_R * CONFIG.glow.size;

function frame(now) {
  const gap = (now - last) / 1000;
  const dt = Math.min(0.05, Math.max(0, gap));
  last = now;
  checkSpeed(now, gap);
  motion += ((reduceMotion.matches ? 0 : 1) - motion) * smooth(dt, 0.25);
  wind += dt * CONFIG.sway.speed;
  if (wind > 3600) wind -= 3600;   // keep the wind clock small for the GPU

  // Parallax: the picture barely moves, the 3D objects a little more
  const follow = smooth(dt, 0.35);
  mouse.x += (mouse.tx * motion - mouse.x) * follow;
  mouse.y += (mouse.ty * motion - mouse.y) * follow;
  for (const [layer, px] of [[plate, CONFIG.parallax.plate], [grass, CONFIG.parallax.grass]]) {
    const s = px * layer.userData.pxToWorld;
    layer.position.set(layer.userData.home.x - mouse.x * s, layer.userData.home.y + mouse.y * s, layer.userData.home.z);
  }
  const rs = CONFIG.parallax.objects * pole.userData.depth / FOCAL;
  rig.position.set(-mouse.x * rs, mouse.y * rs, 0);

  // Wind: the same values drive the painted grass, the blades, the cable and the bulbs
  const W = CONFIG.wind;
  windUniforms.uWindTime.value = wind;
  windUniforms.uWindStrength.value = W.strength * motion;
  windUniforms.uBreeze.value = W.breeze;
  windUniforms.uGustSpeed.value = W.gustSpeed;
  windUniforms.uGustSize.value = W.gustSize;
  windUniforms.uGustEvery.value = W.gustEvery;
  grassMaterial.uniforms.uSway.value = CONFIG.sway.grass * 6;
  bladeMaterial.uniforms.uSway.value = CONFIG.sway.grass;
  bladeMaterial.uniforms.uMouse.value.set(mouse.x, mouse.y);
  bladeMaterial.uniforms.uParallax.value.set(CONFIG.parallax.objects, CONFIG.parallax.grass);
  updateSpan(spans.left, wind, CONFIG.sway.cable * motion);
  updateSpan(spans.right, wind, CONFIG.sway.cable * motion);

  // Opening: bulbs switch on one by one, then the first chapter lights up
  const since = (now - startAt) / 1000;
  const onRate = smooth(dt, 0.07);
  bulbs.forEach((b, i) => {
    const target = reduceMotion.matches || since > 0.35 + i * CONFIG.switchOn ? 1 : 0;
    b.on = reduceMotion.matches ? target : b.on + (target - b.on) * onRate;
  });
  if (active < 0 && bulbs.every(b => b.on > 0.95)) select(0);

  // Phone carousel: glide along the string of lights
  if (carousel && pan !== null && panTarget !== null && Math.abs(pan - panTarget) > 0.05) {
    pan = reduceMotion.matches ? panTarget : pan + (panTarget - pan) * smooth(dt, 0.16);
    applyView();
  }

  // Bulbs: pendulums pushed by the wind where they hang, so a gust swings them one after another
  const push = CONFIG.sway.bulbs * motion;
  const steps = Math.max(1, Math.ceil(dt * 120)), step = dt / steps;
  const litRate = reduceMotion.matches ? 1 : smooth(dt, CONFIG.glow.time / 3);   // reduced motion: instant
  const hoverRate = reduceMotion.matches ? 1 : smooth(dt, 0.08);
  bulbs.forEach((b, i) => {
    b.root.position.copy(b.root.userData.home).add(cableSway(b.x, b.weight, wind, CONFIG.sway.cable * motion));
    const force = push * (windAt(b.x, wind) + 0.12 * Math.sin(wind * (0.9 + 0.13 * i) + 2.1 * i));
    const k = b.rate * b.rate, damp = 0.16 * b.rate;
    for (let s = 0; s < steps; s++) {
      b.sideV += (-k * b.side - damp * b.sideV + 0.12 * k * force) * step;
      b.side += b.sideV * step;
      b.foreV += (-k * b.fore - damp * b.foreV + 0.05 * k * force * Math.sin(wind * 0.7 + i)) * step;
      b.fore += b.foreV * step;
    }
    if (motion < 0.01) b.side = b.sideV = b.fore = b.foreV = 0;
    b.swing.rotation.z = b.side;
    b.swing.rotation.x = b.fore;
    b.hover += ((i === hovered && i < COMPANIES ? 1 : 0) - b.hover) * hoverRate;
    b.lit += ((i === active ? 1 : 0) - b.lit) * litRate;
    const size = baseGlow * (1 + (CONFIG.glow.hover - 1) * b.hover) * (1 + (CONFIG.glow.lit - 1) * b.lit) * (0.6 + 0.4 * b.on);
    b.glow.scale.set(size, size, 1);
    b.glowMaterial.opacity = Math.min(1, CONFIG.glow.opacity * (1 + 0.35 * b.lit)) * b.on;
    b.material.uniforms.uBoost.value = b.lit;
    b.material.uniforms.uOn.value = b.on;
    if (b.signMats) for (const m of b.signMats) m.color.setScalar(Math.min(1, 0.72 + 0.14 * b.hover + 0.2 * b.lit) * (0.35 + 0.65 * b.on));
  });

  renderer.render(scene, camera);
}

/* ---------- Start ---------- */
const loader = new THREE.TextureLoader();
const load = src => new Promise((resolve, reject) => loader.load(src, resolve, undefined, reject));

fitView();
const fontReady = Promise.race([
  document.fonts.load(`600 36px ${SERIF}`).catch(() => null),
  new Promise(r => setTimeout(r, 2500))            // offline: draw the signs with the fallback font
]);
const marksReady = Promise.all(Object.entries(MARKS).map(([k, src]) => loadImage(src).then(im => { markImages[k] = im; })));
Promise.all([load(window.PADDY_IMAGES.plate), load(window.PADDY_IMAGES.grass), fontReady, marksReady]).then(([plateTex, grassTex]) => {
  for (const t of [plateTex, grassTex]) {
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  }
  plateMaterial.uniforms.map.value = plateTex;
  grassMaterial.uniforms.map.value = grassTex;
  sample = makeSampler(grassTex.image);
  placeBlades();
  buildSigns();
  fitView();
  startAt = performance.now();
  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => canvas.classList.add('ready'));
});
</script>
